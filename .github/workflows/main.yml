name: Build WatchFix Native Roothide

on:
  workflow_dispatch: # 允许你随时手动点击按钮开始编译

jobs:
  build:
    runs-on: macos-latest  # 白嫖一台最新的虚拟 Mac 电脑
    
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Roothide 专属 Theos 环境与完整版 iOS SDK
        run: |
          brew install ldid dpkg xz
          # 【关键修改】：使用 Roothide 官方团队专用的 Theos 分支，里面自带 roothide.h
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          
          # 【终极修复】：直接克隆包含所有苹果私有框架的完整 SDK 库（GitHub 服务器网速极快，几秒就能下完）
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git ~/ios-sdks
          
          # 把 14.5 的完整版 SDK 移动到 Theos 的工作目录中
          mv ~/ios-sdks/iPhoneOS14.5.sdk ~/theos/sdks/

      - name: 开始编译 Roothide 原生版插件
        run: |
          export THEOS=~/theos
          # 【关键修改】：明确指定使用刚才下载的 14.5 SDK 进行编译，最低兼容 iOS 15
          make package THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="iphone:14.5:15.0"

      - name: 提取生成的 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: WatchFix-Roothide-Native-DEB
          path: packages/*.deb
