name: Build WatchFix Native Roothide

on:
  workflow_dispatch: # 允许你随时手动点击按钮开始编译

jobs:
  build:
    runs-on: macos-latest  # 白嫖一台最新的虚拟 Mac 电脑
    
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Roothide 专属 Theos 环境与 iOS SDK
        run: |
          brew install ldid dpkg xz
          
          # 【关键修改】：使用 Roothide 官方团队专用的 Theos 分支，里面自带 roothide.h
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          
          # 下载越狱专用的 iOS SDK
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -r master.zip sdks-master

      - name: 开始编译 Roothide 原生版插件
        run: |
          export THEOS=~/theos
          # 【关键修改】：直接打包生成 roothide 格式，不需要再转码了
          make package THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="iphone:latest:15.0"

      - name: 提取生成的 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: WatchFix-Roothide-Native-DEB
          path: packages/*.deb
