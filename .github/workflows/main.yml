name: Build WatchFix Rootless

on:
  workflow_dispatch: # 允许你随时手动点击按钮开始编译

jobs:
  build:
    runs-on: macos-latest  # 白嫖一台最新的虚拟 Mac 电脑
    
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Theos 环境与 iOS SDK
        run: |
          brew install ldid dpkg xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          # 下载越狱专用的 iOS SDK，这步非常关键！
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -r master.zip sdks-master

      - name: 开始编译无根版 (Rootless) 插件
        run: |
          export THEOS=~/theos
          # 强制指定 arm64e 架构和无根方案
          make package THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e" TARGET="iphone:latest:15.0"

      - name: 提取生成的 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: WatchFix-Rootless-DEB
          path: packages/*.deb
