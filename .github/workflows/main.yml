name: Build WatchFix Native Roothide

on:
  workflow_dispatch: # 允许你随时手动点击按钮开始编译

jobs:
  build:
    runs-on: macos-latest  # 白嫖一台最新的虚拟 Mac 电脑
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: 配置 Roothide 专属 Theos 环境与【精确提取版】iOS SDK
        run: |
          brew install ldid dpkg xz
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          
          # 【终极解决】：使用稀疏检出，只拿我们需要的 16.4 和 14.5，避开 16.5 的坑，速度提升百倍！
          mkdir ~/ios-sdks && cd ~/ios-sdks
          git init
          git remote add origin https://github.com/xybp888/iOS-SDKs.git
          git sparse-checkout set iPhoneOS16.4.sdk iPhoneOS14.5.sdk
          git pull --depth 1 origin master || git pull --depth 1 origin main
          
          # 将 16.4 移入工作区
          mv iPhoneOS16.4.sdk ~/theos/sdks/
          
          # 确保 16.4 里有容纳私有框架的文件夹
          mkdir -p ~/theos/sdks/iPhoneOS16.4.sdk/System/Library/PrivateFrameworks/
          
          # 史诗级缝合：把 14.5 里的老旧私有框架复制进去
          cp -Rn iPhoneOS14.5.sdk/System/Library/PrivateFrameworks/* ~/theos/sdks/iPhoneOS16.4.sdk/System/Library/PrivateFrameworks/
          
          # 注入 roothide.h
          cp ~/theos/vendor/include/roothide.h ~/theos/sdks/iPhoneOS16.4.sdk/usr/include/ || true
          
      - name: 开始编译 Roothide 原生版插件
        run: |
          export THEOS=~/theos
          # Target exactly 16.4 to satisfy both Swift Concurrency and NanoRegistry
          make package THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="iphone:16.4:15.0"

      - name: 提取生成的 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: WatchFix-Roothide-Native-DEB
          path: packages/*.deb
