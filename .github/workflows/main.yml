name: Build WatchFix Native Roothide

on:
  workflow_dispatch: # 允许你随时手动点击按钮开始编译

jobs:
  build:
    runs-on: macos-latest  # 白嫖一台最新的虚拟 Mac 电脑
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: 配置 Roothide 专属 Theos 环境与完整版 iOS SDK
        run: |
          brew install ldid dpkg xz
          # 【关键修改】：使用 Roothide 官方团队专用的 Theos 分支，里面自带 roothide.h
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          
          # 克隆包含所有苹果私有框架的完整 SDK 库
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git ~/ios-sdks
          
          # 【关键修改 1】：不要只拿 14.5 了，把里面所有的 SDK（包括 16.x 等新版）全移进 Theos 里
          mv ~/ios-sdks/*.sdk ~/theos/sdks/
          
          # [CRITICAL FIX 2]: Inject roothide.h directly into the SDK's core include folder
          # This guarantees the Swift PCH generator will find it!
          cp ~/theos/vendor/include/roothide.h ~/theos/sdks/iPhoneOS16.4.sdk/usr/include/ || true
          
      - name: 开始编译 Roothide 原生版插件
        run: |
          export THEOS=~/theos
          # Target exactly 16.4 to satisfy both Swift Concurrency and NanoRegistry
          make package THEOS_PACKAGE_SCHEME=roothide ARCHS="arm64 arm64e" TARGET="iphone:16.4:15.0"

      - name: 提取生成的 deb 文件
        uses: actions/upload-artifact@v4
        with:
          name: WatchFix-Roothide-Native-DEB
          path: packages/*.deb
